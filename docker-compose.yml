services:
  postgres:
    image: postgres:16-alpine
    container_name: rfinance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rfinance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - rfinance_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d rfinance']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  rfinance_postgres_data:
